<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#17151C" />
    <meta name="description" content="Ira Workspace — CRM преподавателя с Расмусом, календарём и Telegram-напоминаниями" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <title>Ira Workspace — Расмус</title>
    <style>
      html,body,#root{min-height:100%;margin:0}body{background:#17151C;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#F4EFE3}.boot-screen{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at top left,rgba(232,163,61,.12),transparent 34%),#17151C}.boot-card{width:min(420px,100%);text-align:center}.boot-logo{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border-radius:24px;background:#E8A33D;color:#1C1A20;font-weight:900;font-size:24px;box-shadow:0 18px 45px rgba(232,163,61,.28)}.boot-card h1{font-size:28px;margin:0 0 10px}.boot-card p{color:#928C9C;line-height:1.55}.boot-dots{display:flex;justify-content:center;gap:7px;margin-top:20px}.boot-dots i{width:8px;height:8px;border-radius:50%;background:#E8A33D;animation:boot 1.1s infinite}.boot-dots i:nth-child(2){animation-delay:.15s}.boot-dots i:nth-child(3){animation-delay:.3s}@keyframes boot{50%{transform:translateY(-6px);opacity:.45}}.boot-error{margin-top:18px;padding:14px;border-radius:14px;background:#fff0f1;color:#a33;text-align:left;font-size:13px;overflow-wrap:anywhere}
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script src="./config.js"></script>
    <script>
      window.__iraBootError=function(message){
        var root=document.getElementById('root');
        if(!root||!root.hasAttribute('data-booting'))return;
        var box=document.getElementById('boot-error');
        if(box){box.hidden=false;box.textContent='Ошибка загрузки: '+message+' Обнови страницу или проверь публикацию GitHub Pages.'}
      };
      window.addEventListener('error',function(event){window.__iraBootError(event.message||'не удалось загрузить файл приложения')});
      window.addEventListener('unhandledrejection',function(event){window.__iraBootError(String(event.reason&&event.reason.message||event.reason||'ошибка запуска'))});
      setTimeout(function(){var root=document.getElementById('root');if(root&&root.hasAttribute('data-booting'))window.__iraBootError('приложение не запустилось за 12 секунд.')},12000);
    </script>
  </head>
  <body>
    <div id="root" data-booting>
      <div class="boot-screen"><div class="boot-card"><div class="boot-logo">R</div><h1>Ira Workspace</h1><p>Загружаю рабочее пространство…</p><div class="boot-dots"><i></i><i></i><i></i></div><div id="boot-error" class="boot-error" hidden></div></div></div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

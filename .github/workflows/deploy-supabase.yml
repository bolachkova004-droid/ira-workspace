name: Deploy Ira Workspace backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OWNER_SETUP_CODE: ${{ secrets.OWNER_SETUP_CODE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID TELEGRAM_BOT_TOKEN OWNER_SETUP_CODE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Ira Workspace 7.6.0 does not add a new database migration.
      # We intentionally deploy by project-ref without `supabase link`,
      # because the current CLI/API-key response is failing during link.

      - name: Create server-only secrets
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          CRON_SECRET="$(openssl rand -hex 32)"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            OWNER_SETUP_CODE="$OWNER_SETUP_CODE" \
            TELEGRAM_WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            CRON_SECRET="$CRON_SECRET" \
            BOT_USERNAME="ira_workspace_bot" \
            APP_PUBLIC_URL="https://bolachkova004-droid.github.io/ira-workspace/"

      - name: Deploy workspace API
        run: supabase functions deploy workspace-api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy Telegram webhook
        run: supabase functions deploy telegram-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy reminder worker
        run: supabase functions deploy process-notifications --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Finish
        shell: bash
        run: |
          echo "### Backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Ira Workspace 7.6 functions deployed without Supabase link." >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint: https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/workspace-api" >> "$GITHUB_STEP_SUMMARY"
          echo "Open Ira Workspace → Settings → Настроить бота, then run the test message." >> "$GITHUB_STEP_SUMMARY"

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff8fb" />
  <meta name="description" content="Ira Workspace — рабочее пространство преподавателя английского языка" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Ira Workspace</title>
  <style>
    html,body,#root{min-height:100%;margin:0}.boot-screen{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at top left,#ffe3ed,transparent 34%),#fff8fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2d2730}.boot-card{width:min(420px,100%);text-align:center}.boot-logo{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border-radius:24px;background:#ef6f9d;color:#fff;font-weight:900;font-size:24px;box-shadow:0 18px 45px rgba(239,111,157,.28)}.boot-card h1{font-size:28px;margin:0 0 10px}.boot-card p{color:#7f7580;line-height:1.55}.boot-dots{display:flex;justify-content:center;gap:7px;margin-top:20px}.boot-dots i{width:8px;height:8px;border-radius:50%;background:#ef6f9d;animation:boot 1.1s infinite}.boot-dots i:nth-child(2){animation-delay:.15s}.boot-dots i:nth-child(3){animation-delay:.3s}@keyframes boot{50%{transform:translateY(-6px);opacity:.45}}.boot-error{margin-top:18px;padding:14px;border-radius:14px;background:#fff0f1;color:#a33;text-align:left;font-size:13px;overflow-wrap:anywhere}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.1.1",
        "react/jsx-runtime": "https://esm.sh/react@19.1.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@19.1.1/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6.30.1?deps=react@19.1.1,react-dom@19.1.1",
        "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@19.1.1"
      }
    }
  </script>
  <script>
    window.__iraBootError=function(message){var root=document.getElementById('root');if(!root||!root.hasAttribute('data-booting'))return;var box=document.getElementById('boot-error');if(box){box.hidden=false;box.textContent='Ошибка загрузки: '+message+' Обнови страницу или проверь подключение к интернету.'}};
    window.addEventListener('error',function(event){window.__iraBootError(event.message||'не удалось загрузить файл приложения')});
    window.addEventListener('unhandledrejection',function(event){window.__iraBootError(String(event.reason&&event.reason.message||event.reason||'ошибка запуска'))});
    setTimeout(function(){var root=document.getElementById('root');if(root&&root.hasAttribute('data-booting'))window.__iraBootError('приложение не запустилось за 15 секунд.')},15000);
  </script>
</head>
<body>
  <div id="root" data-booting><div class="boot-screen"><div class="boot-card"><div class="boot-logo">IW</div><h1>Ira Workspace</h1><p>Загружаю рабочее пространство…</p><div class="boot-dots"><i></i><i></i><i></i></div><div id="boot-error" class="boot-error" hidden></div></div></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

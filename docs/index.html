  function importBackupFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(String(r.result));const data=parsed.data||parsed;if(!data.students||!Array.isArray(data.lessons))throw new Error('bad format');state=data;save();view='home';render();toast('Данные восстановлены')}catch{alert('Не удалось прочитать резервную копию')}};r.readAsText(file)}
  function resetWorkspace(){if(!confirm('Вернуть демо-данные? Текущие локальные изменения будут удалены.'))return;state=seed();save();view='home';render();toast('Демо-данные восстановлены')}
  function lessonIcs(lesson){const st=lessonStudent(lesson);const start=new Date(`${lesson.date}T${lesson.time}:00`);const end=new Date(start.getTime()+Number(lesson.duration||60)*60000);const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ira Workspace//RU','BEGIN:VEVENT',`UID:${lesson.id}@ira-workspace`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(end)}`,`SUMMARY:${String(lesson.title||'Урок английского').replace(/[,;]/g,' ')}`,`DESCRIPTION:Урок с ${String(st.name).replace(/[,;]/g,' ')}${lesson.link?'\n'+lesson.link:''}`,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
  function downloadLessonIcs(id){const lesson=state.lessons.find(x=>x.id===id);if(!lesson)return;downloadFile(`lesson-${lesson.date}-${lesson.time.replace(':','')}.ics`,lessonIcs(lesson),'text/calendar;charset=utf-8');toast('Событие календаря скачано')}
  function openStudentChat(student,text=''){if(!student?.telegram){toast('У ученика не указан Telegram');return}const username=student.telegram.replace('@','').trim();const url=`https://t.me/${encodeURIComponent(username)}`;try{window.Telegram?.WebApp?.openTelegramLink(url)}catch{location.href=url}if(text){navigator.clipboard?.writeText(text).then(()=>toast('Текст скопирован — вставь его в чат')).catch(()=>{})}}

  function calendarView(){
    const year=calendarCursor.getFullYear(), month=calendarCursor.getMonth(); const first=new Date(year,month,1); const start=(first.getDay()+6)%7; const daysIn=new Date(year,month+1,0).getDate(); const prevDays=new Date(year,month,0).getDate(); let cells=[];
    for(let i=0;i<42;i++){let n=i-start+1, date, out=false;if(n<1){date=new Date(year,month-1,prevDays+n);out=true}else if(n>daysIn){date=new Date(year,month+1,n-daysIn);out=true}else date=new Date(year,month,n);const ds=toDate(date);const ls=lessonsOn(ds);cells.push(`<button class="day ${out?'out':''} ${ds===today?'today':''} ${ds===selectedDate?'selected':''} ${hasConflict(ds)?'conflict':''}" data-date="${ds}">${date.getDate()}${ls.length?`<span class="marks">${ls.slice(0,3).map(()=>'<i class="mark"></i>').join('')}</span>`:''}</button>`)}

  }
  function hasConflict(date){const ls=lessonsOn(date);for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){const a=Number(ls[i].time.slice(0,2))*60+Number(ls[i].time.slice(3));const b=Number(ls[j].time.slice(0,2))*60+Number(ls[j].time.slice(3));if(Math.abs(a-b)<Math.min(ls[i].duration,ls[j].duration))return true}return false}

  function studentPortal(id){const s=getStudent(id);if(!s)return `<div class="student-portal"><h1>Доступ не найден</h1></div>`;const upcoming=state.lessons.filter(l=>l.studentId===s.id&&l.date>=today&&l.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const next=upcoming[0];return `<div class="student-portal"><div class="brand">${rasmus('tiny')} Ira Workspace</div><p class="eyebrow" style="margin-top:24px">Личный кабинет</p><h1 class="page-title">Привет, ${esc(s.name)}!</h1><p class="subtitle">Твои уроки, домашка и информация по оплате.</p><section class="portal-card"><div class="row-sub">Ближайший урок</div>${next?`<h2>${fmtDate(next.date)} · ${next.time}</h2><p>${esc(next.title)}</p><div class="portal-grid">${next.link?`<a class="primary" href="${esc(next.link)}" rel="noreferrer">На урок</a>`:''}<button class="secondary" data-portal-ics="${next.id}">В календарь</button></div>`:'<p>Урок пока не запланирован.</p>'}</section><section class="portal-card"><div class="row-sub">Ближайшие занятия</div><div class="portal-lessons">${upcoming.length?upcoming.slice(0,6).map(l=>`<div class="portal-lesson"><strong>${fmtDate(l.date)} · ${l.time}</strong><span>${esc(l.title)} · ${l.duration} мин</span></div>`).join(''):'<p>Расписание пока пустое.</p>'}</div></section><section class="portal-card"><div class="row-sub">Оплата</div><h2>${s.balance?money(s.balance):'Всё оплачено'}</h2><p>Осталось занятий: ${Math.max(0,s.packageTotal-s.packageUsed)}</p></section><section class="portal-card"><div class="row-sub">Домашнее</div>${s.homework.length?s.homework.map(h=>`<div class="list-row"><div class="grow"><div class="row-title">${esc(h.title)}</div><div class="row-sub">до ${fmtDate(h.due)}</div></div><span class="badge">${esc(h.status)}</span></div>`).join(''):'<p>Домашнего задания пока нет.</p>'}</section><div class="portal-actions"><a class="secondary wide" href="https://t.me/ira_workspace_bot">Связаться с преподавателем</a></div><div class="demo-banner">Э   function portalLessonIcs(lesson,studentName){const start=new Date(`${lesson.date}T${lesson.time}:00`);const end=new Date(start.getTime()+Number(lesson.duration||60)*60000);const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ira Workspace//RU','BEGIN:VEVENT',`UID:${lesson.id}@ira-workspace`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(end)}`,`SUMMARY:${String(lesson.title||'Урок английского').replace(/[,;]/g,' ')}`,`DESCRIPTION:Урок с преподавателем. Ученик: ${String(studentName||'').replace(/[,;]/g,' ')}${lesson.link?'\\n'+lesson.link:''}`,'END:VEVENT','END:VCALENDAR'].join('\r\n')}

iv class="portal-actions"><a class="secondary wide" href="${esc(data.botLink||`https://t.me/${data.botUsername||'ira_workspace_bot'}`)}">${linked?'Открыть бота':'Подключить уведомления'}</a></div><div class="portal-updated">Обновлено: ${data.updatedAt?new Date(data.updatedAt).toLocaleString('ru-RU'):'только что'}</div></div>`}

ntListener('click',()=>{if(confirm('Удалить ученика и его уроки?')){state.students=state.students.filter(x=>x.id!==existing.id);state.lessons=state.lessons.filter(x=>x.studentId!==existing.id);save();closeModal();view='students';render()}})}
  function openLessonModal(existing){const l=existing||{studentId:state.students[0]?.id||'',date:selectedDate,time:'10:00',duration:60,title:'Индивидуальное',status:'planned',paid:false,link:''};modal(existing?'Редактировать урок':'Новый урок',`<form id="lessonForm" class="form"><label>Ученик<select name="studentId">${state.students.map(s=>`<option value="${s.id}" ${s.id===l.studentId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><div class="form-grid"><label>Дата<input type="date" name="date" value="${l.date}"></label><label>Время<input type="time" name="time" value="${l.time}"></label></div><div class="form-grid"><label>Длительность<input type="number" name="duration" value="${l.duration}"></label><label>Оплата<select name="paid"><option value="true" ${l.paid?'selected':''}>Оплачено</option><option value="false" ${!l.paid?'selected':''}>Не оплачено</option></select></label></div><label>Тип урока<input name="title" value="${esc(l.title)}"></label><label>Ссылка на урок<input name="link" value="${esc(l.link||'')}" placeholder="https://"></label><div class="sheet-actions">${existing?'<button type="button" class="danger" id="cancelLesson">Отменить</button>':''}<button class="primary">Сохранить</button></div></form>`);$('#lessonForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const next={...l,id:existing?.id||uid('l'),studentId:String(f.get('studentId')),date:String(f.get('date')),time:String(f.get('time')),duration:Number(f.get('duration')),title:String(f.get('title')),paid:String(f.get('paid'))==='true',link:String(f.get('link')),status:'planned'};if(existing)Object.assign(existing,next);else state.lessons.push(next);selectedDate=next.date;save();closeModal();render();toast('Урок сохранён')};$('#cancelLesson')?.addEventListener('click',()=>{existing.status='cancelled';save();closeModal();render();toast('Урок отменён')})}
  function openContentModal(){modal('Новая карточка',`<form id="contentForm" class="form"><label>Название<input name="title" required></label><div class="form-grid"><label>Площадка<select name="platform"><option>Threads</option><option>Telegram</option><option>Instagram</option></select></label><label>Этап<select name="stage"><option>Идея</option><option>Черновик</option><option>Готов</option><option>Опубликован</option></select></label></div><label>Дедлайн<input type="date" name="deadline" value="${today}"></label><label>Заметка<textarea name="note"></textarea></label><button class="primary wide">Добавить</button></form>`);$('#contentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.content.unshift({id:uid('c'),title:String(f.get('title')),platform:String(f.get('platform')),stage:String(f.get('stage')),deadline:String(f.get('deadline')),note:String(f.get('note'))});save();closeModal();render();toast('Карточка добавлена')}}
  async function copyStudentLink(){if(cloudReady()){try{await pushCloud(false,false);const data=await cloudRequest('invite',{studentId:selectedStudentId});const student=getStudent(selectedStudentId);const text=`Привет, ${student?.name||''}! Подключи уведомления Ira Workspace по ссылке:
${data.botLink}

Личный кабинет с расписанием и домашним:
${data.portalUrl}`;try{await navigator.clipboard.writeText(text);toast(data.linked?'Доступ скопирован · Telegram уже подключён':'Ссылка подключения скопирована')}catch{prompt('Скопируй сообщение',text)}return}catch(error){alert(error.message);return}}const url=new URL(location.href);url.search='';url.searchParams.set('student',selectedStudentId);try{await navigator.clipboard.writeText(url.toString());toast('Локальная ссылка скопирована')}catch{prompt('Скопируй ссылку',url.toString())}}

  window.addEventListener('error',e=>{console.error(e.error||e.message)});
  initTelegram(); render(); setTimeout(async()=>{if(cloud.endpoint&&telegramInitData()){const ok=await cloudStatusCheck(false);if(ok)await pullCloud(false).catch(()=>{})}},250);
})();
</script>

  function downloadFile(name,content,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}
  function exportBackup(){const payload={app:'Rasmus',version:APP_VERSION,exportedAt:new Date().toISOString(),data:state};downloadFile(`rasmus-backup-${today}.json`,JSON.stringify(payload,null,2));toast('Резервная копия скачана')}
  function importBackupFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(String(r.result));const data=parsed.data||parsed;if(!data.students||!Array.isArray(data.lessons))throw new Error('bad format');state=normalizeState(data);save();view='home';render();toast('Данные восстановлены')}catch{alert('Не удалось прочитать резервную копию')}};r.readAsText(file)}
  function resetWorkspace(){if(!confirm('Вернуть демо-данные? Текущие локальные изменения будут удалены.'))return;state=seed();save();view='home';render();toast('Демо-данные восстановлены')}
  function lessonIcs(lesson){const st=lessonStudent(lesson);const start=new Date(`${lesson.date}T${lesson.time}:00`);const end=new Date(start.getTime()+Number(lesson.duration||60)*60000);const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rasmus//RU','BEGIN:VEVENT',`UID:${lesson.id}@rasmus-teacher`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(end)}`,`SUMMARY:${String(lesson.title||'Урок английского').replace(/[,;]/g,' ')}`,`DESCRIPTION:Урок с ${String(st.name).replace(/[,;]/g,' ')}${lesson.link?'\n'+lesson.link:''}`,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
  function downloadLessonIcs(id){const lesson=state.lessons.find(x=>x.id===id);if(!lesson)return;downloadFile(`lesson-${lesson.date}-${lesson.time.replace(':','')}.ics`,lessonIcs(lesson),'text/calendar;charset=utf-8');toast('Событие календаря скачано')}
  function googleCalendarUrl(lesson){const st=lessonStudent(lesson);const start=new Date(`${lesson.date}T${lesson.time}:00`);const end=new Date(start.getTime()+Number(lesson.duration||60)*60000);const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');const q=new URLSearchParams({action:'TEMPLATE',text:`${lesson.title||'Урок английского'} · ${st.name}`,dates:`${stamp(start)}/${stamp(end)}`,details:`Урок с ${st.name}${lesson.link?'\n'+lesson.link:''}`});return `https://calendar.google.com/calendar/render?${q.toString()}`}
  function openGoogleCalendar(id){const lesson=state.lessons.find(x=>String(x.id)===String(id));if(!lesson)return;const url=googleCalendarUrl(lesson);try{window.Telegram?.WebApp?.openLink(url)}catch{window.open(url,'_blank','noopener')}toast('Открыл Google Calendar — осталось нажать «Сохранить»')}
  function lessonNeedsReport(lesson){if(!lesson||lesson.status!=='planned'||!lesson.date||!lesson.time)return false;const end=new Date(`${lesson.date}T${lesson.time}:00`).getTime()+Number(lesson.duration||60)*60000;return end<=Date.now()}
  function lessonStatusLabel(l){if(l.status==='cancelled')return ['Отменён','cancel'];if(l.status==='completed')return ['Проведён','done'];if(lessonNeedsReport(l))return ['Нужен отчёт','report'];return ['Запланирован','']}
  function openStudentChat(student,text=''){if(!student?.telegram){toast('У ученика не указан Telegram');return}const username=student.telegram.replace('@','').trim();const url=`https://t.me/${encodeURIComponent(username)}`;try{window.Telegram?.WebApp?.openTelegramLink(url)}catch{location.href=url}if(text){navigator.clipboard?.writeText(text).then(()=>toast('Текст скопирован — вставь его в чат')).catch(()=>{})}}

  function getStudent(id){return state.students.find(s=>String(s.id)===String(id))}
  function replaceStudent(id,next){const key=String(id);const normalized=normalizeStudent(next);const found=state.students.some(item=>String(item.id)===key);state.students=found?state.students.map(item=>String(item.id)===key?normalized:item):[normalized,...state.students];return normalized}
  function replaceLesson(id,next){const key=String(id);const found=state.lessons.some(item=>String(item.id)===key);state.lessons=found?state.lessons.map(item=>String(item.id)===key?{...next}:item):[{...next},...state.lessons];return next}
  function lessonStudent(l){return getStudent(l.studentId)||{name:'Пробное занятие',level:'—'}}
  function lessonsOn(date){return state.lessons.filter(l=>l.date===date&&l.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time))}
  function activeStudents(){return state.students.filter(s=>s.status==='Активен')}
  function debt(){return state.students.reduce((a,s)=>a+Math.max(0,Number(s.balance||0)),0)}
  function insight(){const low=state.students.find(s=>s.packageTotal-s.packageUsed<=1);if(low)return `<b>${esc(low.name)} на последнем занятии пакета.</b> Напомни про ${money(low.lessonPrice)} — сам он вряд ли вспомнит.`;const d=state.students.find(s=>s.balance>0);if(d)return `<b>${esc(d.name)} ожидает оплату.</b> Лучше напомнить до следующего урока.`;return '<b>Сегодня всё спокойно.</b> Можно сосредоточиться на уроках и контенте.'}

  function homeView(){
    const todayLessons=lessonsOn(today); const pending=state.reminders.filter(r=>r.status==='review').length;
    return shell(`<section class="view"><div class="hero"><p class="eyebrow">Расмус докладывает</p><div class="hero-row"><div>${rasmus()}</div><div class="speech">${insight()}</div></div><div class="chips"><span class="chip red"><i class="dot"></i>${money(debt())} к оплате</span><span class="chip green"><i class="dot"></i>На проверке: ${pending}</span><span class="chip"><i class="dot"></i>${todayLessons.length} ${plural(todayLessons.length,['урок','урока','уроков'])} сегодня</span></div></div>
      <div class="section-head"><div><p class="eyebrow">Сегодня</p><h2 class="section-title">Коротко</h2></div></div><div class="stats"><article class="stat"><div class="stat-bar"></div><div class="stat-label">Уроки сегодня</div><div class="stat-value">${todayLessons.length}</div></article><article class="stat green"><div class="stat-bar"></div><div class="stat-label">Активные ученики</div><div class="stat-value">${activeStudents().length}</div></article><article class="stat"><div class="stat-bar"></div><div class="stat-label">Напоминания</div><div class="stat-value">${pending}</div></article><article class="stat red"><div class="stat-bar"></div><div class="stat-label">К оплате</div><div class="stat-value">${money(debt())}</div></article></div>

  }

  }

    const left=lessonsLeft(s),due=packageDue(s);const period=[s.packageStart?fmtDate(s.packageStart):'',s.packageEnd?fmtDate(s.packageEnd):''].filter(Boolean).join(' — ')||'без срока';
    return shell(`<section class="view"><button class="back" data-nav="students">← К ученикам</button><div class="profile-head"><div class="avatar large">${initials(s.name)}</div><div class="grow"><p class="eyebrow" style="margin-bottom:4px">${esc(s.status)} · ${esc(s.level)}</p><h1 class="page-title" style="font-size:24px">${esc(s.name)}</h1><p class="subtitle" style="margin-top:4px">с ${new Date(s.createdAt+'T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</p></div><button class="icon-btn" data-action="edit-student">⋮</button></div><div class="goal"><div>🎯</div><div><b>Цель</b>${esc(s.goal)}</div></div><div class="tag-row"><span class="tag active">${esc(s.status)}</span><span class="tag">Уровень ${esc(s.level)}</span>${upcoming?`<span class="tag">Следующий: ${fmtDate(upcoming.date)} ${upcoming.time}</span>`:''}</div>

      <div class="block">${paymentMode(s)==='package'?`<div class="subscription-card"><div class="subscription-head"><div><p class="eyebrow">Формат оплаты</p><span class="mode-pill">Абонемент</span><h2>${esc(s.packageName)}</h2></div><button class="secondary mini" data-action="edit-subscription">Изменить</button></div><div class="subscription-grid"><div><span>Осталось</span><strong>${left}</strong></div><div><span>Использовано</span><strong>${s.packageUsed}/${s.packageTotal}</strong></div><div><span>Оплачено</span><strong>${money(s.packagePaid)}</strong></div></div><div class="progress subscription-progress"><i style="width:${packageProgress(s)}%"></i></div><div class="subscription-foot"><span>${period}</span><b class="${due?'due':'paid'}">${due?money(due)+' к оплате':'Оплачено полностью'}</b></div><div class="subscription-note">${s.autoDeduct?'Занятие списывается только после заполнения отчёта и завершения урока.':'Автосписание выключено.'}</div></div>`:`<div class="subscription-card"><div class="subscription-head"><div><p class="eyebrow">Формат оплаты</p><span class="mode-pill">Разовые занятия</span><h2>${money(s.lessonPrice)} за урок</h2></div></div><div class="payment-summary"><div><span>Проведено</span><strong>${state.lessons.filter(l=>l.studentId===s.id&&l.status==='completed'&&(l.paymentType||'single')==='single').length}</strong></div><div><span>Не оплачено</span><strong>${singleUnpaidLessons(s)}</strong></div><div><span>Долг</span><strong>${money(singleDebt(s))}</strong></div></div><div class="subscription-note">Статус оплаты отмечается отдельно в каждом уроке.</div></div>`}</div>

  function startOfWeek(dateString){const d=new Date(dateString+'T12:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return toDate(d)}
  function calendarLessonRow(l,dark=true){const st=lessonStudent(l);const [label,cls]=lessonStatusLabel(l);return `<div class="agenda-lesson ${l.status==='cancelled'?'cancelled':''} ${l.status==='completed'?'completed':''} ${lessonNeedsReport(l)?'report-needed':''}"><span class="time">${l.time}</span><i class="timeline-node"></i><button class="grow" style="border:0;background:none;color:inherit;text-align:left;padding:0" data-edit-lesson="${l.id}"><span class="row-title">${esc(st.name)}</span><span class="row-sub">${esc(l.title)} · ${l.duration} мин</span></button><span class="lesson-state ${cls}">${label}</span></div>`}
  function calendarDayCard(ds){const lessons=state.lessons.filter(l=>l.date===ds).sort((a,b)=>a.time.localeCompare(b.time));const d=new Date(ds+'T12:00:00');return `<section class="agenda-day ${ds===today?'today-card':''}"><div class="agenda-date"><strong>${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</strong><span>${lessons.length} ${plural(lessons.length,['урок','урока','уроков'])}</span></div>${lessons.length?lessons.map(l=>calendarLessonRow(l)).join(''):'<div class="empty-dark" style="padding:16px">Свободный день</div>'}</section>`}
  function calendarView(){
    const year=calendarCursor.getFullYear(), month=calendarCursor.getMonth();
    let body='';let heading='';
    if(calendarMode==='month'){
      const first=new Date(year,month,1); const start=(first.getDay()+6)%7; const daysIn=new Date(year,month+1,0).getDate(); const prevDays=new Date(year,month,0).getDate(); let cells=[];
      for(let i=0;i<42;i++){let n=i-start+1,date,out=false;if(n<1){date=new Date(year,month-1,prevDays+n);out=true}else if(n>daysIn){date=new Date(year,month+1,n-daysIn);out=true}else date=new Date(year,month,n);const ds=toDate(date);const ls=lessonsOn(ds);cells.push(`<button class="day ${out?'out':''} ${ds===today?'today':''} ${ds===selectedDate?'selected':''} ${hasConflict(ds)?'conflict':''}" data-date="${ds}">${date.getDate()}${ls.length?`<span class="marks">${ls.slice(0,3).map(()=>'<i class="mark"></i>').join('')}</span>`:''}</button>`)}
      const selectedAll=state.lessons.filter(l=>l.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time));heading=calendarCursor.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});body=`<div class="calendar-week"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div><div class="calendar-grid">${cells.join('')}</div><div class="legend"><span><i></i>Уроки</span><span><i class="red"></i>Пересечение</span></div><div class="section-head"><div><p class="eyebrow">Выбранный день</p><h2 class="section-title">${fmtDate(selectedDate)}</h2></div><button class="text-btn" data-action="add-lesson">+ Добавить</button></div><div class="agenda">${selectedAll.length?calendarDayCard(selectedDate):'<div class="empty-dark">В этот день уроков нет.</div>'}</div>`;
    } else if(calendarMode==='week'){
      const ws=startOfWeek(selectedDate);const days=Array.from({length:7},(_,i)=>addDays(ws,i));const endDate=days[6];heading=`${fmtDate(ws)} — ${fmtDate(endDate)}`;body=`<div class="agenda">${days.map(calendarDayCard).join('')}</div>`;
    } else {
      heading=new Date(selectedDate+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});body=`<div class="agenda">${calendarDayCard(selectedDate)}</div>`;
    }
    return shell(`<section class="view"><p class="eyebrow">Расписание</p><h1 class="page-title">Календарь</h1><div class="sync"><i class="sync-dot"></i><div class="sync-text"><b>Rasmus + Google Calendar</b>Из каждого урока можно сразу открыть готовое событие в Google Calendar</div><button class="secondary mini" data-action="add-lesson">+ Урок</button></div><div class="calendar-sync-note">Сейчас это безопасное добавление в Google Calendar без доступа к твоему аккаунту. Полную автоматическую синхронизацию подключим через Google OAuth отдельным шагом.</div><div class="calendar-modes"><button class="calendar-mode ${calendarMode==='month'?'active':''}" data-calendar-mode="month">Месяц</button><button class="calendar-mode ${calendarMode==='week'?'active':''}" data-calendar-mode="week">Неделя</button><button class="calendar-mode ${calendarMode==='day'?'active':''}" data-calendar-mode="day">День</button></div><div class="month-head"><div class="month-title">${heading}</div><div class="month-nav"><button class="icon-btn" data-calendar-shift="-1">←</button><button class="icon-btn" data-calendar-shift="1">→</button></div></div>${body}${hasConflict(selectedDate)&&calendarMode!=='week'?`<div class="conflict-card"><span>⚠️</span><div><b>Есть пересечение.</b> Два урока начинаются слишком близко друг к другу.</div></div>`:''}</section>`,'Календарь');
  }
  function hasConflict(date){const ls=lessonsOn(date);for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){const a=Number(ls[i].time.slice(0,2))*60+Number(ls[i].time.slice(3));const b=Number(ls[j].time.slice(0,2))*60+Number(ls[j].time.slice(3));if(Math.abs(a-b)<Math.min(ls[i].duration,ls[j].duration))return true}return false}

  function studentPortal(id){const s=getStudent(id);if(!s)return `<div class="student-portal"><h1>Доступ не найден</h1></div>`;const upcoming=state.lessons.filter(l=>l.studentId===s.id&&l.date>=today&&l.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const next=upcoming[0];return `<div class="student-portal"><div class="brand">${rasmus('tiny')} Rasmus</div><p class="eyebrow" style="margin-top:24px">Личный кабинет</p><h1 class="page-title">Привет, ${esc(s.name)}!</h1><p class="subtitle">Твои уроки, домашка и информация по оплате.</p><section class="portal-card"><div class="row-sub">Ближайший урок</div>${next?`<h2>${fmtDate(next.date)} · ${next.time}</h2><p>${esc(next.title)}</p><div class="portal-grid">${next.link?`<a class="primary" href="${esc(next.link)}" rel="noreferrer">На урок</a>`:''}<button class="secondary" data-portal-ics="${next.id}">В календарь</button></div>`:'<p>Урок пока не запланирован.</p>'}</section><section class="portal-card"><div class="row-sub">Ближайшие занятия</div><div class="portal-lessons">${upcoming.length?upcoming.slice(0,6).map(l=>`<div class="portal-lesson"><strong>${fmtDate(l.date)} · ${l.time}</strong><span>${esc(l.title)} · ${l.duration} мин</span></div>`).join(''):'<p>Расписание пока пустое.</p>'}</div></section><section class="portal-card"><div class="row-sub">Оплата</div>${paymentMode(s)==='package'?`<h2>${esc(s.packageName||'Абонемент')}</h2><p>Осталось занятий: ${lessonsLeft(s)} из ${s.packageTotal}</p><p>${packageDue(s)?'К оплате: '+money(packageDue(s)):'Оплачено полностью'}</p>`:`<h2>Разовые занятия</h2><p>${money(s.lessonPrice)} за урок</p><p>${singleDebt(s)?'К оплате: '+money(singleDebt(s)):'Все проведённые уроки оплачены'}</p>`}</section><section class="portal-card"><div class="row-sub">Домашнее</div>${s.homework.length?s.homework.map(h=>`<div class="list-row"><div class="grow"><div class="row-title">${esc(h.title)}</div><div class="row-sub">до ${fmtDate(h.due)}</div></div><span class="badge">${esc(h.status)}</span></div>`).join(''):'<p>Домашнего задания пока нет.</p>'}</section><div class="portal-actions"><a class="secondary wide" href="https://t.me/ira_workspace_bot">Связаться с преподавателем</a></div><div class="demo-banner">Это локальный предпросмотр. После подключения облака ученику отправляется отдельная защищённая ссылка.</div></div>`}

  function portalLessonIcs(lesson,studentName){const start=new Date(`${lesson.date}T${lesson.time}:00`);const end=new Date(start.getTime()+Number(lesson.duration||60)*60000);const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rasmus//RU','BEGIN:VEVENT',`UID:${lesson.id}@rasmus-teacher`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(end)}`,`SUMMARY:${String(lesson.title||'Урок английского').replace(/[,;]/g,' ')}`,`DESCRIPTION:Урок с преподавателем. Ученик: ${String(studentName||'').replace(/[,;]/g,' ')}${lesson.link?'\\n'+lesson.link:''}`,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
  function downloadPortalIcs(id){const lesson=portalSession?.lessons?.find(x=>String(x.id)===String(id));if(!lesson)return;downloadFile(`lesson-${lesson.date}-${lesson.time.replace(':','')}.ics`,portalLessonIcs(lesson,portalSession.student?.name),'text/calendar;charset=utf-8');toast('Событие скачано')}
  function cloudStudentPortal(data,token,api){const student=data.student;const portalSymbol=data.currency==='EUR'?'€':data.currency==='USD'?'$':data.currency==='GBP'?'£':data.currency==='KZT'?'₸':'₽';const portalMoney=n=>Number(n||0).toLocaleString('ru-RU')+' '+portalSymbol;const lessons=data.lessons||[];const next=lessons[0];const linked=data.linkedToTelegram;return `<div class="student-portal"><div class="brand">${rasmus('tiny')} Rasmus</div><p class="eyebrow" style="margin-top:24px">Личный кабинет</p><h1 class="page-title">Привет, ${esc(student.name)}!</h1><p class="subtitle">Твои уроки, домашка и информация по оплате.</p><span class="linked-pill ${linked?'':'off'}">${linked?'● Telegram подключён':'○ Telegram ещё не подключён'}</span><section class="portal-card"><div class="row-sub">Ближайший урок</div>${next?`<h2>${fmtDate(next.date)} · ${next.time}</h2><p>${esc(next.title)}</p><div class="portal-grid">${next.link?`<a class="primary" href="${esc(next.link)}" rel="noreferrer">На урок</a>`:''}<button class="secondary" data-cloud-portal-ics="${next.id}">В календарь</button></div><button class="secondary wide portal-request" data-request-reschedule="${next.id}">Попросить перенос</button>`:'<p>Урок пока не запланирован.</p>'}</section><section class="portal-card"><div class="row-sub">Ближайшие занятия</div><div class="portal-lessons">${lessons.length?lessons.slice(0,8).map(l=>`<div class="portal-lesson"><strong>${fmtDate(l.date)} · ${l.time}</strong><span>${esc(l.title)} · ${l.duration} мин</span></div>`).join(''):'<p>Расписание пока пустое.</p>'}</div></section><section class="portal-card"><div class="row-sub">Оплата</div><h2>${student.balance?portalMoney(student.balance):'Всё оплачено'}</h2><p>Осталось занятий: ${Math.max(0,Number(student.packageTotal||0)-Number(student.packageUsed||0))}</p></section><section class="portal-card"><div class="row-sub">Домашнее</div>${(data.homework||[]).length?(data.homework||[]).map(h=>`<div class="list-row"><div class="grow"><div class="row-title">${esc(h.title)}</div><div class="row-sub">до ${fmtDate(h.due)}</div></div><span class="badge">${esc(h.status)}</span></div>`).join(''):'<p>Домашнего задания пока нет.</p>'}</section><div class="portal-actions"><a class="secondary wide" href="${esc(data.botLink||`https://t.me/${data.botUsername||'ira_workspace_bot'}`)}">${linked?'Открыть бота':'Подключить уведомления'}</a></div><div class="portal-updated">Обновлено: ${data.updatedAt?new Date(data.updatedAt).toLocaleString('ru-RU'):'только что'}</div></div>`}
  async function loadCloudPortal(token,api){try{const data=await cloudRequest('portal',{token},{endpoint:api,public:true});portalSession=data;$('#app').innerHTML=cloudStudentPortal(data,token,api);$$('[data-cloud-portal-ics]').forEach(b=>b.onclick=()=>downloadPortalIcs(b.dataset.cloudPortalIcs));$$('[data-request-reschedule]').forEach(b=>b.onclick=async()=>{const note=prompt('Напиши, на какой день или время хочется перенести урок','Можно перенести ближайший урок?');if(!note)return;try{await cloudRequest('request-reschedule',{token,lessonId:b.dataset.requestReschedule,note},{endpoint:api,public:true});toast('Запрос отправлен преподавателю')}catch(error){alert(error.message)}})}catch(error){$('#app').innerHTML=`<div class="student-portal"><div class="portal-error"><h2>Не удалось открыть кабинет</h2><p>${esc(error.message)}</p><a class="secondary wide" href="https://t.me/ira_workspace_bot">Написать преподавателю</a></div></div>`}}

  function studentsViewPatch(){render()}
  function closeModal(){try{window.Telegram?.WebApp?.enableVerticalSwipes?.()}catch{}$('#modalRoot').innerHTML=''}
  function modal(title,body){try{window.Telegram?.WebApp?.disableVerticalSwipes?.()}catch{}$('#modalRoot').innerHTML=`<div class="modal"><section class="sheet"><header class="sheet-head"><h2 class="sheet-title">${title}</h2><button class="icon-btn" id="closeModal" aria-label="Закрыть">×</button></header>${body}</section></div>`;$('#closeModal').onclick=closeModal;$('.modal').onclick=e=>{if(e.target.classList.contains('modal'))closeModal()}}
  function openStudentModal(existing){
    const s=normalizeStudent(existing||{name:'',telegram:'',level:'A2',goal:'',paymentMode:'package',lessonPrice:1800,balance:0,packageTotal:8,packageUsed:0,packagePrice:14400,packagePaid:14400,progress:20,status:'Активен',interests:[],mistakes:[],birthday:'',notes:'',homework:[]});
    modal(existing?'Редактировать ученика':'Новый ученик',`<form id="studentForm" class="form" novalidate><label>Имя<input name="name" required value="${esc(s.name==='Ученик'&&!existing?'':s.name)}"></label><div class="form-grid"><label>Уровень<input name="level" value="${esc(s.level)}"></label><label>Статус<select name="status"><option ${s.status==='Активен'?'selected':''}>Активен</option><option ${s.status==='Пауза'?'selected':''}>Пауза</option><option ${s.status==='Завершил'?'selected':''}>Завершил</option></select></label></div><label>Telegram<input name="telegram" value="${esc(s.telegram)}" placeholder="@username"></label><label>Цель<input name="goal" required value="${esc(s.goal)}"></label><label>Формат оплаты</label><div class="payment-choice"><button type="button" data-payment-mode="package" class="${paymentMode(s)==='package'?'active':''}">Абонемент</button><button type="button" data-payment-mode="single" class="${paymentMode(s)==='single'?'active':''}">Разовые занятия</button></div><input type="hidden" name="paymentMode" value="${paymentMode(s)}"><div class="payment-panel" id="packagePaymentPanel" ${paymentMode(s)==='package'?'':'hidden'}><div class="form-grid"><label>Количество занятий<input type="number" name="packageTotal" value="${s.packageTotal}" min="0"></label><label>Стоимость абонемента<input type="number" name="packagePrice" value="${s.packagePrice}" min="0"></label></div><label>Уже оплачено<input type="number" name="packagePaid" value="${s.packagePaid}" min="0"></label></div><div class="payment-panel" id="singlePaymentPanel" ${paymentMode(s)==='single'?'':'hidden'}><label>Стоимость одного урока<input type="number" name="lessonPrice" value="${s.lessonPrice}" min="0"></label><div class="save-note">После каждого проведённого урока можно отметить «Оплачено» или «Не оплачено».</div></div><label>Заметка<textarea name="notes">${esc(s.notes)}</textarea></label><div class="sheet-actions">${existing?'<button type="button" class="danger" id="deleteStudent">Удалить</button>':''}<button type="button" class="primary" id="saveStudentButton">Сохранить</button></div></form>`);
    const form=$('#studentForm');
    $$('[data-payment-mode]',form).forEach(button=>button.onclick=()=>{const mode=button.dataset.paymentMode;form.elements.paymentMode.value=mode;$$('[data-payment-mode]',form).forEach(x=>x.classList.toggle('active',x===button));$('#packagePaymentPanel').hidden=mode!=='package';$('#singlePaymentPanel').hidden=mode!=='single'});
    $('#saveStudentButton').onclick=()=>{
      const btn=$('#saveStudentButton');
      try{
        const f=new FormData(form);const name=String(f.get('name')||'').trim();const goal=String(f.get('goal')||'').trim();

        if(!goal){toast('Укажи цель обучения');form.elements.goal.focus();return}
        btn.disabled=true;btn.textContent='Готово';
        const mode=String(f.get('paymentMode'))==='single'?'single':'package';const total=Math.max(0,Number(f.get('packageTotal')||0));const lessonPrice=Math.max(0,Number(f.get('lessonPrice')||s.lessonPrice||0));const packagePrice=Math.max(0,Number(f.get('packagePrice')||0));const packagePaid=Math.max(0,Math.min(packagePrice,Number(f.get('packagePaid')||0)));
        const next=normalizeStudent({...s,id:existing?.id||uid('s'),name,telegram:String(f.get('telegram')||'').trim(),level:String(f.get('level')||'').trim(),status:String(f.get('status')||'Активен'),goal,paymentMode:mode,lessonPrice,packageTotal:total,packageName:existing?.packageName||`Абонемент на ${total} занятий`,packagePrice,packagePaid,balance:mode==='package'?Math.max(0,packagePrice-packagePaid):Number(existing?.balance||0),notes:String(f.get('notes')||''),createdAt:existing?.createdAt||today});
        replaceStudent(next.id,next);
        closeModal();view='students';render();toast('Ученик сохранён');

    $('#deleteStudent')?.addEventListener('click',()=>{if(confirm('Удалить ученика и его уроки?')){state.students=state.students.filter(x=>x.id!==existing.id);state.lessons=state.lessons.filter(x=>x.studentId!==existing.id);closeModal();view='students';render();setTimeout(()=>{save();syncImportant('Ученик удалён')},0)}})
  }

  function openSubscriptionModal(student){const s=normalizeStudent(student);modal('Абонемент ученика',`<form id="subscriptionForm" class="form"><label>Название<input name="packageName" value="${esc(s.packageName)}" placeholder="Например, Пакет 8 занятий"></label><div class="form-grid"><label>Всего занятий<input type="number" min="0" name="packageTotal" value="${s.packageTotal}"></label><label>Уже использовано<input type="number" min="0" name="packageUsed" value="${s.packageUsed}"></label></div><div class="form-grid"><label>Стоимость абонемента<input type="number" min="0" name="packagePrice" value="${s.packagePrice}"></label><label>Уже оплачено<input type="number" min="0" name="packagePaid" value="${s.packagePaid}"></label></div><div class="form-grid"><label>Начало<input type="date" name="packageStart" value="${s.packageStart}"></label><label>Действует до<input type="date" name="packageEnd" value="${s.packageEnd}"></label></div><label class="check-row"><input type="checkbox" name="autoDeduct" ${s.autoDeduct?'checked':''}><span>Списывать занятие после заполненного отчёта и завершения урока</span></label><button class="primary wide" id="saveSubscriptionButton">Сохранить абонемент</button></form>`);$('#subscriptionForm').onsubmit=e=>{e.preventDefault();const btn=$('#saveSubscriptionButton');try{btn.disabled=true;const f=new FormData(e.currentTarget);const total=Math.max(0,Number(f.get('packageTotal')));const used=Math.max(0,Math.min(total,Number(f.get('packageUsed'))));const price=Math.max(0,Number(f.get('packagePrice')));const paid=Math.max(0,Math.min(price,Number(f.get('packagePaid'))));replaceStudent(s.id,{...s,packageName:String(f.get('packageName')).trim()||`Абонемент на ${total} занятий`,packageTotal:total,packageUsed:used,packagePrice:price,packagePaid:paid,balance:Math.max(0,price-paid),packageStart:String(f.get('packageStart')),packageEnd:String(f.get('packageEnd')),autoDeduct:f.get('autoDeduct')==='on'});closeModal();render();toast('Абонемент сохранён');setTimeout(()=>{save();syncImportant('Абонемент сохранён')},0)}catch(error){btn.disabled=false;alert('Не удалось сохранить абонемент: '+(error?.message||error))}}}
  function changePackageUsed(studentId,delta){const student=getStudent(studentId);if(!student)return;replaceStudent(student.id,{...student,packageUsed:Math.max(0,Math.min(Number(student.packageTotal||0),Number(student.packageUsed||0)+Number(delta||0)))})}
  function reconcilePackageForLesson(oldLesson,nextLesson){if(oldLesson?.packageCounted)changePackageUsed(oldLesson.studentId,-1);nextLesson.packageCounted=false;const student=getStudent(nextLesson.studentId);if(nextLesson.status==='completed'&&nextLesson.reportCompleted&&nextLesson.paymentType==='package'&&student&&student.autoDeduct!==false){changePackageUsed(nextLesson.studentId,1);nextLesson.packageCounted=true}}
  function cancelLesson(lesson){if(!lesson)return;if(!confirm('Отменить этот урок? Ученик получит уведомление, если Telegram подключён.'))return;const next={...lesson,status:'cancelled',cancelledAt:new Date().toISOString()};reconcilePackageForLesson({...lesson},next);replaceLesson(next.id,next);closeModal();render();save();syncImportant('Урок отменён');}
  function rescheduleLesson(lesson){if(!lesson||lesson.status!=='planned')return;modal('Перенести урок',`<form id="rescheduleLessonForm" class="form"><div class="confirm-card"><b>${esc(lessonStudent(lesson).name)}</b><br>Сейчас: ${fmtDate(lesson.date)} · ${lesson.time}</div><div class="form-grid"><label>Новая дата<input type="date" name="date" value="${lesson.date}" required></label><label>Новое время<input type="time" name="time" value="${lesson.time}" required></label></div><div class="onboarding-note">Если ученик подключён к Rasmus, ему автоматически придёт сообщение о переносе после синхронизации.</div><div class="sheet-actions"><button type="button" class="secondary" id="cancelMoveLesson">Не переносить</button><button class="primary" id="confirmMoveLesson">Перенести</button></div></form>`);$('#cancelMoveLesson').onclick=closeModal;$('#rescheduleLessonForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const date=String(f.get('date'));const time=String(f.get('time'));if(date===lesson.date&&time===lesson.time){toast('Выбери новую дату или время');return}const next={...lesson,date,time,rescheduledAt:new Date().toISOString(),previousDate:lesson.date,previousTime:lesson.time};replaceLesson(next.id,next);selectedDate=date;calendarCursor=new Date(date+'T12:00:00');closeModal();render();save();syncImportant('Урок перенесён')}}
  function openLessonReport(lesson){if(!lesson)return;const st=lessonStudent(lesson);const report=lesson.report||{};modal('Отчёт по уроку',`<form id="lessonReportForm" class="form"><div class="report-card"><b>${esc(st.name)} · ${fmtDate(lesson.date)} ${lesson.time}</b><p>Абонемент спишется только после кнопки «Завершить урок».</p></div><label>Что делали на уроке<textarea name="summary" placeholder="Тема, материалы, что успели">${esc(report.summary||'')}</textarea></label><label>Как прошло<textarea name="progress" placeholder="Что получилось, над чем ещё работать">${esc(report.progress||'')}</textarea></label><label>Домашнее / следующий шаг<textarea name="homework" placeholder="Что сделать к следующему уроку">${esc(report.homework||'')}</textarea></label><div class="sheet-actions report-actions"><button type="button" class="secondary" id="saveDraftReport">Сохранить черновик</button><button type="button" class="primary" id="completeLessonReport">✓ Завершить урок</button></div></form>`);const form=$('#lessonReportForm');const data=()=>{const f=new FormData(form);return {summary:String(f.get('summary')||'').trim(),progress:String(f.get('progress')||'').trim(),homework:String(f.get('homework')||'').trim(),updatedAt:new Date().toISOString()}};$('#saveDraftReport').onclick=()=>{const next={...lesson,report:data()};replaceLesson(next.id,next);closeModal();render();save();syncImportant('Черновик отчёта сохранён')};$('#completeLessonReport').onclick=()=>{const report=data();if(!report.summary&&!report.progress){toast('Добавь хотя бы пару слов об уроке');return}const next={...lesson,status:'completed',reportCompleted:true,completedAt:new Date().toISOString(),report};reconcilePackageForLesson({...lesson},next);replaceLesson(next.id,next);closeModal();render();save();const st2=getStudent(next.studentId);toast(next.paymentType==='package'&&st2?.autoDeduct!==false?'Урок завершён · списано 1 занятие':'Урок завершён');syncImportant('Отчёт сохранён')};}
  function openLessonModal(existing){if(!existing&&!state.students.length){toast('Сначала добавь ученика');view='students';render();setTimeout(()=>openStudentModal(),80);return}const baseStudent=getStudent(existing?.studentId||state.students[0]?.id);const l=existing||{studentId:baseStudent?.id||'',date:selectedDate,time:'10:00',duration:60,title:'Индивидуальное',status:'planned',paid:false,link:'',paymentType:paymentMode(baseStudent),packageCounted:false,reportCompleted:false,report:{}};const [statusLabel,statusClass]=lessonStatusLabel(l);modal(existing?'Урок':'Новый урок',`<form id="lessonForm" class="form"><label>Ученик<select name="studentId">${state.students.map(s=>`<option value="${s.id}" ${s.id===l.studentId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><div class="form-grid"><label>Дата<input type="date" name="date" value="${l.date}"></label><label>Время<input type="time" name="time" value="${l.time}"></label></div><div class="form-grid"><label>Статус<div class="save-note"><span class="lesson-state ${statusClass}">${statusLabel}</span>${l.status==='planned'?' · проведённым станет после отчёта':''}</div></label><label>Тип оплаты<select name="paymentType"><option value="package" ${(l.paymentType||paymentMode(baseStudent))==='package'?'selected':''}>Из абонемента</option><option value="single" ${(l.paymentType||paymentMode(baseStudent))==='single'?'selected':''}>Разовое занятие</option></select></label></div><div class="form-grid"><label>Оплата<select name="paid"><option value="true" ${l.paid?'selected':''}>Оплачено</option><option value="false" ${!l.paid?'selected':''}>Не оплачено</option></select></label><label>Длительность<input type="number" name="duration" value="${l.duration}"></label></div><label>Тип урока<input name="title" value="${esc(l.title)}"></label><label>Ссылка на урок<input name="link" value="${esc(l.link||'')}" placeholder="https://"></label>${l.reportCompleted?`<div class="report-card"><b>Отчёт заполнен</b><p>${esc(l.report?.summary||l.report?.progress||'Урок завершён')}</p></div>`:''}<div class="sheet-actions lesson-actions">${existing&&l.status==='planned'?`<button type="button" class="secondary move-btn" id="moveLessonButton">↪ Перенести</button>`:''}${existing&&l.status!=='cancelled'?`<button type="button" class="danger" id="cancelLessonButton">× Отменить</button>`:''}${existing&&l.status!=='cancelled'?`<button type="button" class="secondary google-btn" id="googleLessonButton">Google Calendar</button>`:''}${existing&&l.status==='planned'?`<button type="button" class="primary" id="reportLessonButton">${lessonNeedsReport(l)?'📝 Отчёт и завершить':'📝 Отчёт'}</button>`:''}${existing&&l.status==='completed'?`<button type="button" class="secondary" id="reportLessonButton">Открыть отчёт</button>`:''}<button type="button" class="primary wide-row" id="saveLessonButton">Сохранить изменения</button></div></form>`);const form=$('#lessonForm');form.elements.studentId.onchange=()=>{const student=getStudent(form.elements.studentId.value);form.elements.paymentType.value=paymentMode(student)};$('#moveLessonButton')?.addEventListener('click',()=>rescheduleLesson(l));$('#cancelLessonButton')?.addEventListener('click',()=>cancelLesson(l));$('#googleLessonButton')?.addEventListener('click',()=>openGoogleCalendar(l.id));$('#reportLessonButton')?.addEventListener('click',()=>{const f=new FormData(form);const draft={...l,studentId:String(f.get('studentId')),date:String(f.get('date')),time:String(f.get('time')),duration:Number(f.get('duration')),title:String(f.get('title')),paid:String(f.get('paid'))==='true',link:String(f.get('link')),paymentType:String(f.get('paymentType'))==='single'?'single':'package'};replaceLesson(draft.id,draft);closeModal();openLessonReport(draft)});$('#saveLessonButton').onclick=()=>{const btn=$('#saveLessonButton');try{btn.disabled=true;const f=new FormData(form);const next={...l,id:existing?.id||uid('l'),studentId:String(f.get('studentId')),date:String(f.get('date')),time:String(f.get('time')),duration:Number(f.get('duration')),title:String(f.get('title')),paid:String(f.get('paid'))==='true',link:String(f.get('link')),paymentType:String(f.get('paymentType'))==='single'?'single':'package'};reconcilePackageForLesson(existing?{...existing}:null,next);replaceLesson(next.id,next);selectedDate=next.date;calendarCursor=new Date(next.date+'T12:00:00');closeModal();render();toast('Урок сохранён');setTimeout(()=>{save();syncImportant('Урок сохранён')},0)}catch(error){btn.disabled=false;alert('Не удалось сохранить урок: '+(error?.message||error))}}}

  function openContentModal(){modal('Новая карточка',`<form id="contentForm" class="form"><label>Название<input name="title" required></label><div class="form-grid"><label>Площадка<select name="platform"><option>Threads</option><option>Telegram</option><option>Instagram</option></select></label><label>Этап<select name="stage"><option>Идея</option><option>Черновик</option><option>Готов</option><option>Опубликован</option></select></label></div><label>Дедлайн<input type="date" name="deadline" value="${today}"></label><label>Заметка<textarea name="note"></textarea></label><button class="primary wide">Добавить</button></form>`);$('#contentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.content.unshift({id:uid('c'),title:String(f.get('title')),platform:String(f.get('platform')),stage:String(f.get('stage')),deadline:String(f.get('deadline')),note:String(f.get('note'))});save();closeModal();render();toast('Карточка добавлена')}}
  async function copyStudentLink(){if(cloudReady()){try{await pushCloud(false,false);const data=await cloudRequest('invite',{studentId:selectedStudentId});const student=getStudent(selectedStudentId);const text=`Привет, ${student?.name||''}! Подключи уведомления Rasmus по ссылке:
${data.botLink}

Личный кабинет с расписанием и домашним:
${data.portalUrl}`;try{await navigator.clipboard.writeText(text);toast(data.linked?'Доступ скопирован · Telegram уже подключён':'Ссылка подключения скопирована')}catch{prompt('Скопируй сообщение',text)}return}catch(error){alert(error.message);return}}const url=new URL(location.href);url.search='';url.searchParams.set('student',selectedStudentId);try{await navigator.clipboard.writeText(url.toString());toast('Локальная ссылка скопирована')}catch{prompt('Скопируй ссылку',url.toString())}}

  window.addEventListener('error',e=>{console.error(e.error||e.message)});
  initTelegram(); render(); if(telegramInitData()){bootstrapWorkspace().finally(()=>{startAutoSync();setTimeout(()=>void autoSync(),1200)})}else{startAutoSync()};
})();

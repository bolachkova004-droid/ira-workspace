  function rasmusView(){
    const settings=[['payment','💸','Оплата','за 1 занятие до конца пакета'],['homework','📝','Домашка','за день до занятия, если не сделана'],['lesson','⏰','Скоро урок','за 1 час до начала'],['lead','👋','Заявка молчит','нет ответа 2 дня']]; const queue=state.reminders.filter(r=>r.status==='review');
    return shell(`<section class="view"><p class="eyebrow">Ассистент</p><h1 class="page-title">Расмус</h1><div class="reminder-intro">${rasmus('small')}<div><b>Рутину беру на себя.</b> Но сообщения про деньги и живых людей сначала показываю тебе.</div></div><div class="section-head"><div><p class="eyebrow">Типы напоминаний</p><h2 class="section-title">Настрой под себя</h2></div><button class="text-btn" data-nav="analytics">Аналитика →</button></div>${settings.map(([key,icon,name,sub])=>`<div class="setting-card"><div class="setting-top"><span class="setting-icon">${icon}</span><div><div class="setting-name">${name}</div><div class="setting-sub">${sub}</div></div></div><div class="segments">${['auto','review','off'].map(mode=>`<button class="segment ${state.reminderSettings[key]===mode?'on '+mode:''}" data-reminder-key="${key}" data-mode="${mode}">${mode==='auto'?'Авто':mode==='review'?'На проверку':'Выкл'}</button>`).join('')}</div></div>`).join('')}<div class="section-head"><div><p class="eyebrow">Ждут тебя</p><h2 class="section-title">На проверку · ${queue.length}</h2></div></div>${queue.length?queue.map(r=>{const s=getStudent(r.studentId)||{name:'Ученик'};return `<article class="queue-card"><div class="queue-head"><span class="queue-avatar">${initials(s.name)}</span><span class="queue-name">${esc(s.name)} · ${r.type==='payment'?'оплата':'напоминание'}</span><span class="queue-time">сегодня</span></div><div class="queue-text">«${esc(r.text)}»</div><div class="queue-actions"><button class="send-btn" data-send-reminder="${r.id}">Отправить</button><button class="edit-btn" data-edit-reminder="${r.id}">Изменить</button><button class="dismiss-btn" data-dismiss-reminder="${r.id}">×</button></div></article>`}).join(''):'<div class="empty-dark">На проверке ничего нет.</div>'}<div class="demo-banner"><b>Важно:</b> сейчас кнопка «Отправить» сохраняет действие внутри приложения. Для реальной доставки ученикам нужен серверный Bot Token — его нельзя хранить в публичном GitHub.</div></section>`,'Расмус');
  }

  function analyticsView(){
    const a=state.analytics; const values={clicks:a.sources.reduce((x,y)=>x+y.value,0),leads:28,game:71,conversion:'8.2%'};
    return shell(`<section class="view"><button class="back" data-nav="rasmus">← К Расмусу</button><p class="eyebrow">Данные</p><h1 class="page-title">Аналитика</h1><div class="analytics-periods">${['7','30','90'].map(p=>`<button class="period ${a.period===p?'active':''}" data-period="${p}">${p} дней</button>`).join('')}</div><div class="section-head"><div><p class="eyebrow">Общая картина</p><h2 class="section-title">За ${a.period} дней</h2></div></div><div class="stats"><article class="stat"><div class="stat-bar"></div><div class="stat-label">Переходы по ссылкам</div><div class="stat-value">${values.clicks}</div><div class="stat-trend">▲ 18%</div></article><article class="stat green"><div class="stat-bar"></div><div class="stat-label">Заявки</div><div class="stat-value">${values.leads}</div><div class="stat-trend">▲ 6</div></article><article class="stat green"><div class="stat-bar"></div><div class="stat-label">Прошли Ravenhill</div><div class="stat-value">${values.game}</div><div class="stat-trend">▲ 24%</div></article><article class="stat red"><div class="stat-bar"></div><div class="stat-label">Конверсия</div><div class="stat-value">${values.conversion}</div></article></div><div class="section-head"><div><p class="eyebrow">По ссылкам</p><h2 class="section-title">Что тащит трафик</h2></div></div><div class="paper source-list">${a.sources.map(s=>`<div class="source-row"><span class="source-icon">${s.icon}</span><span class="grow"><span class="row-title">${esc(s.name)}</span><span class="row-sub">${esc(s.sub)}</span></span><span class="source-number">${s.value}<span class="source-trend">${s.trend>=0?'▲':'▼'}${Math.abs(s.trend)}%</span></span></div>`).join('')}</div><div class="section-head"><div><p class="eyebrow">Воронка</p><h2 class="section-title">The Ravenhill Case</h2></div></div><div class="paper funnel">${[['Начали игру',156,100],['Дошли до середины',98,63],['Закончили полностью',71,46],['Оставили заявку',28,18]].map((x,i)=>`<div class="funnel-row"><div class="funnel-label"><span>${x[0]}</span><span>${x[1]} · ${x[2]}%</span></div><div class="funnel-track"><div class="funnel-fill ${i===3?'red':''}" style="width:${x[2]}%"></div></div></div>`).join('')}</div><div class="insight">${rasmus('tiny')}<span><b>Расмус:</b> половина пользователей теряется между серединой и финалом игры. Стоит проверить этот участок.</span></div></section>`,'Аналитика');
  }

  function studentPortal(id){const s=getStudent(id);if(!s)return `<div class="student-portal"><h1>Доступ не найден</h1></div>`;const upcoming=state.lessons.filter(l=>l.studentId===s.id&&l.date>=today&&l.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="student-portal"><div class="brand">${rasmus('tiny')} Ira Workspace</div><p class="eyebrow" style="margin-top:24px">Личный кабинет</p><h1 class="page-title">Привет, ${esc(s.name)}!</h1><p class="subtitle">Здесь видны уроки, домашка и оплата.</p><section class="portal-card"><div class="row-sub">Ближайший урок</div>${upcoming[0]?`<h2>${fmtDate(upcoming[0].date)} · ${upcoming[0].time}</h2><p>${esc(upcoming[0].title)}</p>${upcoming[0].link?`<a class="primary wide" href="${esc(upcoming[0].link)}">Открыть ссылку на урок</a>`:''}`:'<p>Урок пока не запланирован.</p>'}</section><section class="portal-card"><div class="row-sub">Оплата</div><h2>${s.balance?money(s.balance):'Всё оплачено'}</h2><p>Осталось занятий: ${Math.max(0,s.packageTotal-s.packageUsed)}</p></section><section class="portal-card"><div class="row-sub">Домашнее</div>${s.homework.length?s.homework.map(h=>`<div class="list-row"><div class="grow"><div class="row-title">${esc(h.title)}</div><div class="row-sub">до ${fmtDate(h.due)}</div></div><span class="badge">${esc(h.status)}</span></div>`).join(''):'<p>Домашнего задания пока нет.</p>'}</section><div class="demo-banner">Это локальный демонстрационный кабинет. Для синхронизации между твоим устройством и устройством ученика подключается защищённая база данных.</div></div>`}

  function render(){
    const studentParam=new URLSearchParams(location.search).get('student'); if(studentParam){$('#app').innerHTML=studentPortal(studentParam);$('#modalRoot').innerHTML='';return}
    let html=view==='home'?homeView():view==='students'?studentsView():view==='profile'?profileView():view==='calendar'?calendarView():view==='content'?contentView():view==='rasmus'?rasmusView():analyticsView();$('#app').innerHTML=html;bind();window.scrollTo({top:0,behavior:'instant'});
  }
  function nav(to){view=to;vibrate();render()}
  function bind(){
    $$('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
    $('[data-action="analytics"]')?.addEventListener('click',()=>nav('analytics'));
    $('[data-action="notify"]')?.addEventListener('click',()=>toast(`${state.reminders.filter(r=>r.status==='review').length} напоминания ждут проверки`));
    $('#studentSearch')?.addEventListener('input',e=>{search=e.target.value;studentsViewPatch()});
    $$('[data-student]').forEach(b=>b.onclick=()=>{selectedStudentId=b.dataset.student;view='profile';render()});
    $('[data-action="add-student"]')?.addEventListener('click',openStudentModal);
    $('[data-action="edit-student"]')?.addEventListener('click',()=>openStudentModal(getStudent(selectedStudentId)));
    $('[data-action="message-student"]')?.addEventListener('click',()=>{const s=getStudent(selectedStudentId);if(s.telegram)location.href=`https://t.me/${s.telegram.replace('@','')}`;else toast('У ученика не указан Telegram')});
    $('[data-action="student-link"]')?.addEventListener('click',copyStudentLink);
    $$('[data-month]').forEach(b=>b.onclick=()=>{calendarCursor.setMonth(calendarCursor.getMonth()+Number(b.dataset.month));render()});
    $$('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});
    $$('[data-action="add-lesson"]').forEach(b=>b.onclick=()=>openLessonModal());
    $$('[data-edit-lesson]').forEach(b=>b.onclick=()=>openLessonModal(state.lessons.find(l=>l.id===b.dataset.editLesson)));
    $$('[data-reminder-key]').forEach(b=>b.onclick=()=>{state.reminderSettings[b.dataset.reminderKey]=b.dataset.mode;save();render();toast('Настройка сохранена')});
    $$('[data-send-reminder]').forEach(b=>b.onclick=()=>{const r=state.reminders.find(x=>x.id===b.dataset.sendReminder);r.status='sent';save();render();toast('Отмечено как отправленное')});
    $$('[data-dismiss-reminder]').forEach(b=>b.onclick=()=>{state.reminders=state.reminders.filter(x=>x.id!==b.dataset.dismissReminder);save();render();toast('Напоминание удалено')});
    $$('[data-edit-reminder]').forEach(b=>b.onclick=()=>{const r=state.reminders.find(x=>x.id===b.dataset.editReminder);const text=prompt('Текст сообщения',r.text);if(text){r.text=text;save();render()}});
    $('[data-action="add-content"]')?.addEventListener('click',openContentModal);
    $$('[data-move-content]').forEach(b=>b.onclick=()=>{const stages=['Идея','Черновик','Готов','Опубликован'];const c=state.content.find(x=>x.id===b.dataset.moveContent);const i=stages.indexOf(c.stage)+Number(b.dataset.dir);if(stages[i])c.stage=stages[i];save();render()});
    $$('[data-delete-content]').forEach(b=>b.onclick=()=>{state.content=state.content.filter(x=>x.id!==b.dataset.deleteContent);save();render();toast('Карточка удалена')});
    $$('[data-period]').forEach(b=>b.onclick=()=>{state.analytics.period=b.dataset.period;save();render()});
  }
  function studentsViewPatch(){render()}
  function closeModal(){$('#modalRoot').innerHTML=''}
  function modal(title,body){$('#modalRoot').innerHTML=`<div class="modal"><section class="sheet"><header class="sheet-head"><h2 class="sheet-title">${title}</h2><button class="icon-btn" id="closeModal">×</button></header>${body}</section></div>`;$('#closeModal').onclick=closeModal;$('.modal').onclick=e=>{if(e.target.classList.contains('modal'))closeModal()}}
  function openStudentModal(existing){const s=existing||{name:'',telegram:'',level:'A2',goal:'',lessonPrice:1800,balance:0,packageTotal:8,packageUsed:0,progress:20,status:'Активен',interests:[],mistakes:[],birthday:'',notes:'',homework:[]};modal(existing?'Редактировать ученика':'Новый ученик',`<form id="studentForm" class="form"><label>Имя<input name="name" required value="${esc(s.name)}"></label><div class="form-grid"><label>Уровень<input name="level" value="${esc(s.level)}"></label><label>Telegram<input name="telegram" value="${esc(s.telegram)}" placeholder="@username"></label></div><label>Цель<input name="goal" required value="${esc(s.goal)}"></label><div class="form-grid"><label>Стоимость урока<input type="number" name="lessonPrice" value="${s.lessonPrice}"></label><label>К оплате<input type="number" name="balance" value="${s.balance}"></label></div><div class="form-grid"><label>Пакет всего<input type="number" name="packageTotal" value="${s.packageTotal}"></label><label>Использовано<input type="number" name="packageUsed" value="${s.packageUsed}"></label></div><label>Заметка<textarea name="notes">${esc(s.notes)}</textarea></label><div class="sheet-actions">${existing?'<button type="button" class="danger" id="deleteStudent">Удалить</button>':''}<button class="primary">Сохранить</button></div></form>`);$('#studentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const next={...s,id:existing?.id||uid('s'),name:String(f.get('name')).trim(),telegram:String(f.get('telegram')).trim(),level:String(f.get('level')).trim(),goal:String(f.get('goal')).trim(),lessonPrice:Number(f.get('lessonPrice')),balance:Number(f.get('balance')),packageTotal:Number(f.get('packageTotal')),packageUsed:Number(f.get('packageUsed')),notes:String(f.get('notes')),createdAt:existing?.createdAt||today};if(existing)Object.assign(existing,next);else state.students.unshift(next);save();closeModal();view='students';render();toast('Ученик сохранён')};$('#deleteStudent')?.addEventListener('click',()=>{if(confirm('Удалить ученика и его уроки?')){state.students=state.students.filter(x=>x.id!==existing.id);state.lessons=state.lessons.filter(x=>x.studentId!==existing.id);save();closeModal();view='students';render()}})}
  function openLessonModal(existing){const l=existing||{studentId:state.students[0]?.id||'',date:selectedDate,time:'10:00',duration:60,title:'Индивидуальное',status:'planned',paid:false,link:''};modal(existing?'Редактировать урок':'Новый урок',`<form id="lessonForm" class="form"><label>Ученик<select name="studentId">${state.students.map(s=>`<option value="${s.id}" ${s.id===l.studentId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><div class="form-grid"><label>Дата<input type="date" name="date" value="${l.date}"></label><label>Время<input type="time" name="time" value="${l.time}"></label></div><div class="form-grid"><label>Длительность<input type="number" name="duration" value="${l.duration}"></label><label>Оплата<select name="paid"><option value="true" ${l.paid?'selected':''}>Оплачено</option><option value="false" ${!l.paid?'selected':''}>Не оплачено</option></select></label></div><label>Тип урока<input name="title" value="${esc(l.title)}"></label><label>Ссылка на урок<input name="link" value="${esc(l.link||'')}" placeholder="https://"></label><div class="sheet-actions">${existing?'<button type="button" class="danger" id="cancelLesson">Отменить</button>':''}<button class="primary">Сохранить</button></div></form>`);$('#lessonForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const next={...l,id:existing?.id||uid('l'),studentId:String(f.get('studentId')),date:String(f.get('date')),time:String(f.get('time')),duration:Number(f.get('duration')),title:String(f.get('title')),paid:String(f.get('paid'))==='true',link:String(f.get('link')),status:'planned'};if(existing)Object.assign(existing,next);else state.lessons.push(next);selectedDate=next.date;save();closeModal();render();toast('Урок сохранён')};$('#cancelLesson')?.addEventListener('click',()=>{existing.status='cancelled';save();closeModal();render();toast('Урок отменён')})}
  function openContentModal(){modal('Новая карточка',`<form id="contentForm" class="form"><label>Название<input name="title" required></label><div class="form-grid"><label>Площадка<select name="platform"><option>Threads</option><option>Telegram</option><option>Instagram</option></select></label><label>Этап<select name="stage"><option>Идея</option><option>Черновик</option><option>Готов</option><option>Опубликован</option></select></label></div><label>Дедлайн<input type="date" name="deadline" value="${today}"></label><label>Заметка<textarea name="note"></textarea></label><button class="primary wide">Добавить</button></form>`);$('#contentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.content.unshift({id:uid('c'),title:String(f.get('title')),platform:String(f.get('platform')),stage:String(f.get('stage')),deadline:String(f.get('deadline')),note:String(f.get('note'))});save();closeModal();render();toast('Карточка добавлена')}}
  async function copyStudentLink(){const url=new URL(location.href);url.search='';url.searchParams.set('student',selectedStudentId);try{await navigator.clipboard.writeText(url.toString());toast('Ссылка скопирована')}catch{prompt('Скопируй ссылку',url.toString())}}

  window.addEventListener('error',e=>{console.error(e.error||e.message)});
  initTelegram(); render();
})();
</script>
</body>
</html>
